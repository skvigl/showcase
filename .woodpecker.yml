when:
  - event: push
    branch: prod

steps:
  deploy:
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/showcase:/root/showcase
    commands:
      - git config --global --add safe.directory '*'
      - cd /root/showcase
      - git checkout prod
      - git pull origin prod
      - docker compose up -d --build --no-deps api simulator stats client admin
