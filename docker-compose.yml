services:
  api:
    container_name: showcase-api
    build: ./api2
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./api2/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  simulator:
    container_name: showcase-simulator
    build: ./simulator
    env_file:
      - ./simulator/.env.production

  stats:
    container_name: showcase-stats
    build: ./stats
    ports:
      - "127.0.0.1:3011:3000"
    env_file:
      - ./stats/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # notifier:
  #   build: ./notifier
  #   volumes:
  #     - ./notifier:/app
  #   env_file:
  #     - .env
  # depends_on:
  #   - rabbitmq

  client:
    container_name: showcase-client
    build: ./client
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./client/.env.production

  admin:
    container_name: showcase-admin
    build: ./admin
    ports:
      - "127.0.0.1:4200:3000"

  postgres:
    image: postgres:18.1-alpine3.23
    container_name: showcase-pg
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    container_name: showcase-redis
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
